{% extends "base.html" %}

{% block title %}My To-Do List{% endblock %}

{% block content %}
    <h1>My To-Do List</h1>

    <form action="{{ url_for('add_task') }}" method="post" class="add-form">
        <input type="text" name="title" placeholder="What needs doing?" required>
        <button type="submit">Add</button>
    </form>

    <ul class="task-list">
        {% for task in tasks %}
            <li class="{{ 'done' if task.done else '' }}">
                <form action="{{ url_for('toggle_task', task_id=task.id) }}" method="post" class="inline-form">
                    <button type="submit" class="toggle-btn">
                        {{ '✓' if task.done else '○' }}
                    </button>
                </form>
                <span class="title">{{ task.title }}</span>
                <form action="{{ url_for('delete_task', task_id=task.id) }}" method="post" class="inline-form">
                    <button type="submit" class="delete-btn">✕</button>
                </form>
            </li>
        {% else %}
            <li class="empty">No tasks yet — add one above.</li>
        {% endfor %}
    </ul>
{% endblock %}
